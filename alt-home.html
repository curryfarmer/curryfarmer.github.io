<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ====================================================================
       alt-home.html — an ALTERNATE cover (template). Brand top-left, a big
       centred typed headline, and the section links scattered across the
       page. The classic homepage is index.html; this is just a second look.

       TO USE THIS AS YOUR REAL HOMEPAGE: rename this file to index.html
       (and rename the old index.html to something else first).
       TO MOVE THE LINKS: edit the top/left percentages for `.scatter a`
       in styles.css (each one is labelled).
       ==================================================================== -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>alternate home — john-paul wee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesque:wght@400..700&family=Inter:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="/images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="manifest" href="/images/site.webmanifest" />
</head>
<body class="home">

  <!-- top bar: john-paul wee, plus a small way back to the classic home -->
  <header class="site-header">
    <nav class="site-nav wrap" aria-label="home">
      <a class="brand" href="index.html">john-paul wee</a>
      <a class="alt-back" href="index.html">classic home →</a>
    </nav>
  </header>

  <main class="cover-main">
    <!-- the big headline. the word after "i'm a" rotates (see script below). -->
    <h1 class="cover-headline">i'm a <span id="typed" class="typed">backend engineer</span><span class="caret" aria-hidden="true"></span></h1>

    <!-- the scattered navigation. order here matches the positions in styles.css. -->
    <nav class="scatter" aria-label="primary">
      <a href="resume.html">resume</a>
      <a href="projects.html">projects</a>
      <a href="snapshots.html">snapshots</a>
      <a href="musings.html">musings</a>
      <a href="now.html">now</a>
      <a href="interests.html">interests</a>
      <a href="https://www.linkedin.com/in/wydjohnpaul" target="_blank" rel="noopener">linkedin</a>
      <a href="https://www.instagram.com/wyd_jp/" target="_blank" rel="noopener">instagram</a>
    </nav>
  </main>

  <footer class="site-footer wrap">
    <!-- EDIT: your email -->
    <p>© <span id="year"></span> john-paul wee · <a href="mailto:wydjohnpaul@gmail.com">wydjohnpaul@gmail.com</a> · <a href="https://www.linkedin.com/in/wydjohnpaul">linkedin</a> · <a href="https://www.instagram.com/wyd_jp/">instagram</a></p>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>

  <!-- typing animation: cycles the words after "i'm a". EDIT the phrases list. -->
  <script>
    (function () {
      var el = document.getElementById("typed");
      if (!el) return;
      var phrases = ["backend engineer", "photographer", "slow reader", "occasional tinkerer"]; // EDIT: your roles
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) { el.textContent = phrases[0]; return; }   // no animation if the device asked for less motion
      var p = 0, c = 0, deleting = false;
      el.textContent = "";
      (function tick() {
        var word = phrases[p];
        c += deleting ? -1 : 1;
        el.textContent = word.slice(0, c);
        if (!deleting && c === word.length) { deleting = true; return setTimeout(tick, 1400); }
        if (deleting && c === 0) { deleting = false; p = (p + 1) % phrases.length; }
        setTimeout(tick, deleting ? 55 : 95);
      })();
    })();
  </script>
</body>
</html>
