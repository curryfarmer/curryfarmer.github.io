<!DOCTYPE html>

  <!-- ====================================================================
       snapshots.html — a travel journal. Photos grouped by place, newest
       trip first. Click a photo to enlarge it (lightbox).

       TO ADD A TRIP:   duplicate a whole <section class="trip"> block.
       TO ADD A PHOTO:  duplicate a <button class="shot"> block. To make it
                        a real photo, replace the <div class="placeholder">
                        with  <img src="photos/lisbon-1.jpg" alt="...">  AND
                        add  data-full="photos/lisbon-1.jpg"  to the button
                        (that's the big version the lightbox shows).
       Make a "photos" folder next to this file and drop images in.
       ==================================================================== -->

  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="shortcut icon" href="/images/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />

<body>

            <div class="placeholder">photo</div>

          <button class="shot" type="button" data-cap="lisbon · spring '24">
            <div class="placeholder">photo</div>
          </button>
          <button class="shot" type="button" data-cap="lisbon · spring '24">
            <div class="placeholder">photo</div>
          </button>
          <button class="shot" type="button" data-cap="lisbon · spring '24">
            <div class="placeholder">photo</div>

            <div class="placeholder">photo</div>

        </div>
      </section>

      <section class="trip">
        <h2 class="trip-place">tokyo <span class="trip-when">winter '23</span></h2>

  <!-- the lightbox: hidden until you click a photo that has a data-full image -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="photo viewer">
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="close">✕</button>
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-cap" id="lightbox-cap"></p>
  </div>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>

  <!-- lightbox behaviour. opens only for photos that have a real data-full image. -->
  <script>
    (function () {
      var box = document.getElementById("lightbox");
      var img = document.getElementById("lightbox-img");
      var cap = document.getElementById("lightbox-cap");
      var closeBtn = document.getElementById("lightbox-close");
      if (!box) return;
      var opener = null;
      function open(shot) {
        var full = shot.getAttribute("data-full");
        if (!full) return;            // placeholder with no real photo yet — nothing to enlarge
        opener = shot;
        img.src = full;
        img.alt = shot.getAttribute("data-cap") || "";
        cap.textContent = shot.getAttribute("data-cap") || "";
        box.hidden = false;
        closeBtn.focus();
      }
      function close() {
        box.hidden = true;
        img.removeAttribute("src");
        if (opener) opener.focus();
      }
      document.querySelectorAll(".shot").forEach(function (s) {
        s.addEventListener("click", function () { open(s); });
      });
      closeBtn.addEventListener("click", close);
      box.addEventListener("click", function (e) { if (e.target === box) close(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !box.hidden) close();
      });
    })();
  </script>
</body>
</html>
